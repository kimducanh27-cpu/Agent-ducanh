name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check docs and secrets
        run: node scripts/check-docs.mjs
      - name: Check Superpowers skill names
        run: node scripts/check-superpowers.mjs
      - name: Check Antigravity subagents
        run: node scripts/check-antigravity.mjs
      - name: Check persona cards
        run: node scripts/check-personas.mjs
      - name: Check leader dispatch
        run: node scripts/check-dispatch.mjs
      - name: Check UI quality
        run: node scripts/check-ui.mjs
      - name: Check UI style
        run: node scripts/check-style.mjs
      - name: Run kit evals
        run: node scripts/eval-kits.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Serve demo
        run: |
          python3 -m http.server 8123 --directory examples/demo-site &
          echo $! > /tmp/demo.pid
          curl --retry 10 --retry-connrefused --retry-delay 1 -s http://127.0.0.1:8123/ > /dev/null
      - name: Verify demo in Chrome
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          DEMO_BASE: http://127.0.0.1:8123/
        run: node scripts/ci-browser-smoke.mjs
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/demo.pid) || true
