repos:
  - repo: local
    hooks:
      - id: check-docs
        name: Agent-ducanh check docs/secrets
        entry: node scripts/check-docs.mjs
        language: system
        pass_filenames: false
      - id: check-superpowers
        name: Agent-ducanh check Superpowers names
        entry: node scripts/check-superpowers.mjs
        language: system
        pass_filenames: false
      - id: check-antigravity
        name: Agent-ducanh check Antigravity subagents
        entry: node scripts/check-antigravity.mjs
        language: system
        pass_filenames: false
      - id: check-personas
        name: Agent-ducanh check persona cards
        entry: node scripts/check-personas.mjs
        language: system
        pass_filenames: false
      - id: check-dispatch
        name: Agent-ducanh check leader dispatch
        entry: node scripts/check-dispatch.mjs
        language: system
        pass_filenames: false
      - id: check-ui
        name: Agent-ducanh check UI quality
        entry: node scripts/check-ui.mjs
        language: system
        pass_filenames: false
      - id: eval-kits
        name: Agent-ducanh eval routing
        entry: node scripts/eval-kits.mjs
        language: system
        pass_filenames: false
